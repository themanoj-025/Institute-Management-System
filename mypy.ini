# Mypy configuration for IMS.
#
# The codebase uses legacy SQLAlchemy `Column()` declarative style, which mypy
# cannot type-check without Mapped[]-style annotations. Rather than failing the
# hook on that legacy noise (assignment/arg-type/attr-defined etc. from Column
# instances and untyped dict access in ML code), those error codes are scoped
# out here so the hook runs on real targets and still catches genuine issues
# (union-attr, call-arg, index, list-item, ...) on new code.
#
# Revisit this list when models migrate to `Mapped[...]` annotations.
[mypy]
ignore_missing_imports = True
strict_optional = True
python_version = 3.10
disable_error_code = assignment, annotation-unchecked, arg-type, attr-defined, dict-item, return-value, var-annotated, operator
