# Cancel superseded runs of this workflow on the same ref (PR pushes).
# Never cancels on main pushes or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token scope; jobs declaring their own permissions override this.
permissions:
  contents: read

name: Load Test

# Manual load test: boots the API locally, drives k6 against it, and
# fails on threshold breaches (p95 latency, error rate).
# Scheduled runs were removed: they failed every week because nothing
# ever started the server (k6 hit localhost with no app running).

on:
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          JWT_SECRET=ci-secret SECRET_KEY=ci-secret API_KEY=ci-key uvicorn api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to become healthy within 60s"
          tail -50 uvicorn.log || true
          exit 1

      - name: Prepare results dir
        run: mkdir -p k6-results

      - name: Setup k6
        uses: grafana/setup-k6-action@e8a4df30dd7db7da61a537ed3c92bdb0220da2ef # v1

      - name: Run k6 load test
        uses: grafana/run-k6-action@edc3caa23751024c725fbad360a2072e340492d8 # v1
        with:
          path: scripts/loadtest/load-test.js
          flags: --quiet --summary-export=k6-results/summary.json
          env: |
            K6_BASE_URL=http://127.0.0.1:8000

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k6-results
          path: k6-results/
