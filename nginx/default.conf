# ── Nginx Reverse Proxy Configuration ──────────────────────────────
# Terminates TLS and proxies to the FastAPI application.
#
# TLS certificates are served from /etc/nginx/ssl/:
#   - Local dev: self-signed cert.pem / key.pem (generated by scripts/gen-selfsigned.sh)
#   - Production: Let's Encrypt certs provisioned by certbot container
#
# Let's Encrypt ACME HTTP-01 challenge is served on port 80 at
# /.well-known/acme-challenge/ before the HTTP→HTTPS redirect.
#
# Production setup:
#   1. Set DOMAIN_NAME, CERTBOT_EMAIL, and USE_LETSENCRYPT=true in .env
#   2. docker compose up -d nginx certbot
#   3. docker compose run certbot certonly --webroot -w /var/www/certbot -d $DOMAIN_NAME
#   4. Certificates will auto-renew via certbot container loop
#
# Local development (no domain required):
#   1. Run: scripts/gen-selfsigned.sh
#   2. docker compose up -d
# ───────────────────────────────────────────────────────────────────

upstream bbims_api {
    server api:8000;
    keepalive 64;
}

# ── ACME HTTP-01 challenge (served before redirect) ────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge — served before the redirect so certbot
    # can validate domain ownership over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS certificates ─────────────────────────────────────────
    # Self-signed:  ./nginx/ssl/cert.pem, ./nginx/ssl/key.pem
    # Let's Encrypt: ./nginx/ssl/live/<domain>/fullchain.pem, privkey.pem
    # The nginx config expects these exact paths.
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ── Upload size limit ──────────────────────────────────────
    client_max_body_size 10M;

    # ── Web Dashboard (SPA) ────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── Dashboard static assets (long-lived cache) ───────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ───────────────────────────────────────────────
    location /v1/ {
        proxy_pass http://bbims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Health & metrics (not behind SPA) ───────────────────────
    location /health {
        proxy_pass http://bbims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://bbims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket support (if needed) ──────────────────────────
    location /ws/ {
        proxy_pass http://bbims_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Static files (served directly by nginx) ─────────────────
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
